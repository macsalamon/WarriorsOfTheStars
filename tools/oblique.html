<!doctype html>
<meta charset="utf-8">
<title>Oblique views</title>
<body style="margin:0;background:#334;color:#ddd;font:13px sans-serif">
<canvas id="c"></canvas><pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
/* A quick look from eight directions around a model (and from above and below): ?m=name&elev=30 */
const p = new URLSearchParams(location.search);
const name = p.get('m');
const elev = Number(p.get('elev') ?? 30);
const T = Number(p.get('t') ?? 380);
const gltf = await new GLTFLoader().loadAsync(`/Models/${name}.glb`);
const root = gltf.scene;
if (p.get('anim') && gltf.animations.length) {
  const clip = gltf.animations.find((a) => a.name === p.get('anim')) ?? gltf.animations[0];
  const mixer = new THREE.AnimationMixer(root);
  mixer.clipAction(clip).play();
  mixer.setTime(Number(p.get('at') ?? 0));
}
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root);
const centre = box.getCenter(new THREE.Vector3());
const radius = box.getSize(new THREE.Vector3()).length() / 2;
const scene = new THREE.Scene();
scene.add(root);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(T, T); r.setClearColor(0x445566, 1);
r.outputColorSpace = THREE.SRGBColorSpace;
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const key = new THREE.DirectionalLight(0xffffff, 1.8); scene.add(key);
const out = document.getElementById('c');
const azims = [0, 45, 90, 135, 180, 225, 270, 315];
out.width = T * 4; out.height = T * 2;
const ctx = out.getContext('2d');
const cam = new THREE.PerspectiveCamera(30, 1, radius * 0.05, radius * 30);
const dist = (radius * 1.1) / Math.sin((30 * Math.PI) / 360);
azims.forEach((az, i) => {
  const a = (az * Math.PI) / 180, e = (elev * Math.PI) / 180;
  cam.position.set(centre.x + Math.sin(a) * Math.cos(e) * dist, centre.y + Math.sin(e) * dist, centre.z + Math.cos(a) * Math.cos(e) * dist);
  cam.up.set(0, 1, 0); cam.lookAt(centre);
  key.position.copy(cam.position).add(new THREE.Vector3(-1, 1.5, 0.5).multiplyScalar(radius));
  r.render(scene, cam);
  ctx.drawImage(r.domElement, (i % 4) * T, Math.floor(i / 4) * T);
  ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif';
  ctx.fillText(`azimuth ${az} (0 = from +Z, 90 = from +X)  elev ${elev}`, (i % 4) * T + 6, Math.floor(i / 4) * T + 18);
});
const blob = await new Promise((res) => out.toBlob(res, 'image/png'));
await fetch('/__save?name=' + (p.get('out') ?? 'oblique') + '.png', { method: 'POST', body: blob });
window.__done = true;
</script>
