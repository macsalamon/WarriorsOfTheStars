<!doctype html>
<meta charset="utf-8">
<title>Model renders</title>
<body style="margin:0;background:#334;color:#ddd;font:13px sans-serif">
<pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';

const log = (t) => (document.getElementById('log').textContent += t + '\n');
const params = new URLSearchParams(location.search);
const models = (params.get('m') ?? 'x-wing,a-wing,tie_fighter,interceptor_tie').split(',');
const names = { 'x-wing': 'x-wing', 'a-wing': 'a-wing', tie_fighter: 'tie-fighter', interceptor_tie: 'tie-interceptor' };

/** Some textures are paler than others: a lower number darkens that ship. */
const EXPOSURE = { 'x-wing': 0.6 };

const BIG = 1600;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(BIG, BIG);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

/** The part of the picture that is not transparent, as a cropped canvas. */
function crop(src, pad) {
  const w = src.width, h = src.height;
  const data = src.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3] > 8) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1 + pad * 2; out.height = y1 - y0 + 1 + pad * 2;
  out.getContext('2d').drawImage(src, x0, y0, x1 - x0 + 1, y1 - y0 + 1, pad, pad, x1 - x0 + 1, y1 - y0 + 1);
  return out;
}

function fit(src, w, h) {
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const c = out.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.drawImage(src, 0, 0, w, h);
  return out;
}

async function save(canvas, name) {
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  await fetch('/__save?name=' + name, { method: 'POST', body: blob });
  log('saved ' + name + ' ' + canvas.width + 'x' + canvas.height);
}

/** Looks: the TIE Fighter model has no textures, so it gets a gunmetal paint like the board art. */
function paint(name, root) {
  if (name !== 'tie_fighter' || params.get('paint') === '0') return;
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      // only the pale hull parts: the near-black materials are the window and the vents
      if (m.color.r + m.color.g + m.color.b < 0.9) continue;
      m.color.set(0x56616e); m.metalness = 0.55; m.roughness = 0.45;
    }
  });
}

for (const m of models) {
  const gltf = await new GLTFLoader().loadAsync(`/Models/${m}.glb`);
  const root = gltf.scene;
  paint(m, root);
  // the X-wing's S-foils are animated: the clip holds the fully open (attack) position between 3.7 and 6.3 seconds
  if (m === 'x-wing' && gltf.animations.length) {
    const mixer = new THREE.AnimationMixer(root);
    mixer.clipAction(gltf.animations[0]).play();
    mixer.setTime(Number(params.get('open') ?? 4.5));
  }
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.62;
  const scene = new THREE.Scene();
  scene.environment = env;
  const exposure = EXPOSURE[m] ?? 1;
  scene.environmentIntensity = 0.4 * exposure;
  scene.add(root);
  const key = new THREE.DirectionalLight(0xfff4e6, 1.3 * exposure);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xbcd0ff, 0.25 * exposure);
  scene.add(fill);

  const shoot = (dir, up, keyAt, fillAt) => {
    const cam = new THREE.OrthographicCamera(-radius, radius, radius, -radius, radius * 0.1, radius * 20);
    cam.position.copy(centre).addScaledVector(new THREE.Vector3(...dir).normalize(), radius * 6);
    cam.up.set(...up);
    cam.lookAt(centre);
    const rel = (v) => centre.clone().add(new THREE.Vector3(...v).multiplyScalar(radius * 4));
    key.position.copy(rel(keyAt)); fill.position.copy(rel(fillAt));
    renderer.render(scene, cam);
    const c = document.createElement('canvas');
    c.width = BIG; c.height = BIG;
    c.getContext('2d').drawImage(renderer.domElement, 0, 0);
    return c;
  };

  // top: nose to the top of the picture, light from the upper left
  const top = crop(shoot([0, 1, 0], [0, 0, 1], [-1, 2, 0.6], [1, 1, -1]), 8);
  const th = 640;
  await save(fit(top, Math.round((top.width * th) / top.height), th), `${names[m]}-top.png`);

  // front: seen from the nose, 15 degrees above, on a square picture
  const ang = (15 * Math.PI) / 180;
  const front = crop(shoot([0, Math.sin(ang), Math.cos(ang)], [0, 1, 0], [-1, 1.5, 1.2], [1, 0.5, 1]), 10);
  const side = Math.max(front.width, front.height);
  const sq = document.createElement('canvas');
  sq.width = side; sq.height = side;
  sq.getContext('2d').drawImage(front, (side - front.width) / 2, (side - front.height) / 2);
  await save(fit(sq, 512, 512), `${names[m]}-front.png`);
}
window.__done = true;
log('done');
</script>
